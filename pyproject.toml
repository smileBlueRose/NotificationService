[project]
name = "sis2"
version = "0.1.0"
description = "Notification Service"
readme = "README.md"
authors = [
    { name = "Smile", email = "156634569+smileBlueRose@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.15.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "grpcio>=1.85.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "protobuf>=7.36.2",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.85.1",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["src/event_contract"]

[tool.ruff.lint]
select = ["E", "F", "I"]
